<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./css/main.css">

  <title>Frontend Mentor | Order summary card</title>
</head>
<body>
  <main class="container">
    <article class="order-card">
      <div class="order-card__image">
        <img src="./images/illustration-hero.svg" alt="Illustration of a person listening to music">
      </div>

      <div class="order-card__content">
        <h1 class="order-card__title">Order Summary</h1>
        <p class="order-card__description">You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!</p>

        <div class="order-card__plan plan-box">
          <div class="plan-box__group">
            <img src="./images/icon-music.svg" alt="Music icon" class="plan-box__icon">
            <div class="plan-box__info">
              <p class="plan-box__name">Annual Plan</p>
              <p class="plan-box__price">$59.99/year</p>
            </div>
              <a href="#" class="plan-box__link">Change</a>
          </div>
        </div>
          
        <div class="order-card__actions">
          <button class="order-card__actions--primary">Proceed to Payment</button>
          <button class="order-card__actions--secondary">Cancel Order</button>
        </div>
        
      </div>
    </article>
  </main>
</body>
</html>
